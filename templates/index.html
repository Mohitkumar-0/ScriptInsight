<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handwriting Personality Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI handwriting analysis</p>
          <h1>Personality Detector</h1>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <span id="themeIcon">🌙</span>
        </button>
      </header>

      <main class="container">
        <section class="hero card">
          <div class="hero-copy">
            <h2>Upload a handwriting sample</h2>
            <p>
              Our model analyzes a handwriting image and predicts the dominant personality trait
              from the Big Five personality model.
            </p>
          </div>

          <form id="uploadForm" class="upload-form" enctype="multipart/form-data">
            <label for="fileInput" class="upload-box" id="uploadBox" tabindex="0">
              <input id="fileInput" name="file" type="file" accept=".png,.jpg,.jpeg,.gif,.bmp,.tif,.tiff,image/png,image/jpeg,image/gif,image/bmp,image/tiff" />
              <div class="upload-content">
                <div class="upload-icon">✍️</div>
                <div>
                  <strong id="selectedFileLabel">Choose a handwriting image</strong>
                  <span>PNG, JPG, JPEG, GIF, BMP, TIFF</span>
                </div>
              </div>
            </label>

            <div id="selectedPreviewWrap" class="preview-wrap hidden">
              <img id="selectedPreview" alt="Selected handwriting preview" />
            </div>

            <div id="fileMessage" class="file-message" aria-live="polite"></div>

            <div class="form-actions">
              <button type="submit" class="primary-btn" id="analyzeBtn">Analyze handwriting</button>
            </div>
          </form>
        </section>

        <section id="resultPanel" class="results card hidden">
          <div class="result-header">
            <div>
              <p class="eyebrow">Prediction</p>
              <h3 id="predictedTrait">-</h3>
            </div>
            <div class="confidence-badge">
              <span>Confidence</span>
              <strong id="confidenceValue">0%</strong>
            </div>
          </div>

          <div class="probability-grid" id="probabilityGrid"></div>
        </section>

        <section id="traitDetails" class="trait-details card hidden">
          <div class="section-header">
            <p class="eyebrow">Trait details</p>
            <h3>Personality trait overview</h3>
          </div>
          <div id="traitDetailsContent"></div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
